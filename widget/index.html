<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XTApp Studio</title>
<style>html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:#f6f7f9;color:#18202a}main{padding:18px;display:grid;gap:14px}section{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:14px}h1{font-size:20px;margin:0}.muted{color:#66717d}.status{display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:#e5a400}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}button{border:1px solid #bfc8d2;border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer}pre{white-space:pre-wrap;max-height:240px;overflow:auto;background:#f3f5f7;padding:10px;border-radius:8px}</style></head>
<body><main><section><div class="status"><span class="dot"></span><h1>XTApp Studio</h1></div><p class="muted">Codex 右侧预览面板</p><div class="row"><span>设备</span><strong id="device">X4 Pro</strong></div><div class="row"><span>契约</span><strong id="contract">等待读取</strong></div><button id="refresh">刷新状态</button></section><section><strong>运行结果</strong><pre id="output">请在聊天中要求 Codex 运行当前 XTApp 项目。</pre></section></main>
<script>(async()=>{const out=document.querySelector('#output');const call=async(name,arguments_={})=>{if(window.openai?.callTool)return window.openai.callTool({name,arguments:arguments_});if(window.cowartMcp?.callServerTool)return window.cowartMcp.callServerTool({name,arguments:arguments_});return null};document.querySelector('#refresh').onclick=async()=>{out.textContent='正在读取契约与项目状态…';try{const r=await call('search_xtapp_knowledge',{query:'Lua',limit:3});out.textContent=r?.content?.[0]?.text||JSON.stringify(r,null,2)||'Widget bridge 尚未连接。'}catch(e){out.textContent=e.message}}})()</script></body></html>
